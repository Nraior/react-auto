name: Main CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Deps
        run: yarn install --frozen-lockfile

      - name: Testing
        run: yarn test --watchAll=false
        env:
          CI: true

      - name: Build
        run: yarn build
        env:
          CI: true
